# linny-web-theme — config defaults
#
# Hugo only merges a LIMITED set of config keys from a theme/module into the
# consuming site: `taxonomies`, `menu` and `params` DO merge (the notebook wins
# on conflicts). Root-level keys such as `markup`, `frontmatter`, `pagination`,
# `outputs` and `enableGitInfo` do NOT merge from a theme — those must live in
# the notebook's own hugo-web.yaml. The linny-notebook-template ships a complete
# hugo-web.yaml with exactly those keys; see this theme's README.
#
# So a notebook needs, on top of what merges from here:
#   title / baseURL / languageCode / enableGitInfo
#   markup (goldmark.unsafe + highlight)  ·  frontmatter.date (crdate mapping)
#   pagination.pagerSize                  ·  module.imports (this theme)

# --- these DO merge into the notebook ---

# Taxonomies that Linny notebooks use.
taxonomies:
  tags: "tags"
  project: "project"
  customer: "customer"
  type: "type"

# Top menu: the four taxonomy landing pages.
menu:
  main:
    - identifier: customers
      name: Customers
      url: /customer/
      weight: 10
    - identifier: projects
      name: Projects
      url: /project/
      weight: 20
    - identifier: types
      name: Types
      url: /type/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

params:
  description: "Linny note-taking system"

  # geekdoc options — sensible defaults for a Linny notebook.
  geekdocRepo: ""
  geekdocEditPath: ""
  geekdocSearch: true
  geekdocSearchShowParent: true
  geekdocMenuBundle: false
  geekdocFileTreeSortBy: "title"
  geekdocCollapseAllSections: false
  geekdocContentLicense: false
  geekdocTagsToMenu: true
  geekdocBackToTop: true
  # Show "Updated on …" from git .Lastmod (needs enableGitInfo in the notebook).
  geekdocPageLastmod: true
