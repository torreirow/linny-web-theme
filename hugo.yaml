# linny-web-theme — config defaults
#
# Hugo only merges `params` from a theme/module into the consuming site (the
# notebook wins on conflicts). Site-level config — `taxonomies`, `menu`,
# `markup`, `frontmatter`, `pagination`, `outputs`, `enableGitInfo` — is NOT
# merged from a theme and MUST live in the notebook's own hugo-web.yaml.
#
# The linny-notebook-template ships a complete hugo-web.yaml with exactly those
# keys (taxonomies customer/project/type/tags, the top menu, the crdate->date
# mapping, goldmark unsafe, pagerSize, enableGitInfo). See this theme's README.
#
# So a notebook needs, on top of the geekdoc params that merge from here:
#   title / baseURL / languageCode / enableGitInfo
#   taxonomies + menu + markup + frontmatter.date + pagination
#   module.imports (this theme)

params:
  description: "Linny note-taking system"

  # geekdoc options — sensible defaults for a Linny notebook (these DO merge).
  geekdocRepo: ""
  geekdocEditPath: ""
  geekdocSearch: true
  geekdocSearchShowParent: true
  geekdocMenuBundle: false
  geekdocFileTreeSortBy: "title"
  geekdocCollapseAllSections: false
  geekdocContentLicense: false
  geekdocTagsToMenu: true
  geekdocBackToTop: true
  # Show "Updated on …" from git .Lastmod (needs enableGitInfo in the notebook).
  geekdocPageLastmod: true
